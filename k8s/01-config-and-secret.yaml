# ==============================================================================
# NON-SENSITIVE CONFIGURATION (CONFIGMAP)
# Separates environment-specific settings from immutable container images.
# Note: Database credentials (Secret/ctrm-db-secret) are created out-of-band
# via `kubectl create secret` so passwords are never committed to Git.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctrm-app-config
  labels:
    app: ctrm-trade-ingest
data:
  # Internal Kubernetes DNS name matching the PostgreSQL ClusterIP Service
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "trades_db"