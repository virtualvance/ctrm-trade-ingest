# ==============================================================================
# CONFIGURATION & CREDENTIALS (CONFIGMAP + SECRET)
# Separates environment-specific settings from immutable container images.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctrm-app-config
  labels:
    app: ctrm-trade-ingest
data:
  # Internal Kubernetes DNS name matching the PostgreSQL ClusterIP Service below
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "trades_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: ctrm-db-secret
  labels:
    app: ctrm-trade-ingest
type: Opaque
# stringData automatically base64-encodes values upon creation in Kubernetes
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "ctrm_secure_k8s_password"