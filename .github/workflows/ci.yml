# ==============================================================================
# CI/CD PIPELINE: LINT, UNIT TEST, VULNERABILITY SCAN, & REGISTRY PUBLISH
# ==============================================================================
name: CI/CD Pipeline

# Trigger automatically on pull requests targeting main and direct pushes to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Enforce least-privilege GitHub token permissions across the workflow.
# Only read repository code and write container packages to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: STATIC LINTING & UNIT TESTING
  # Acts as a fast quality gate before spending time building container images.
  # ----------------------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 static code linter
        run: flake8 app tests --count --max-line-length=120 --statistics

      - name: Run Pytest unit test suite
        run: pytest -v -W ignore

  # ----------------------------------------------------------------------------
  # JOB 2: CONTAINER BUILD & TRIVY VULNERABILITY SCANNING
  # Scans the compiled image for CRITICAL OS/library CVEs before publishing.
  # ----------------------------------------------------------------------------
  security-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build local Docker image for scanning
        run: docker build -t ctrm-scan:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ctrm-scan:${{ github.sha }}
          format: 'table'
          # Block pipeline progression if unpatched CRITICAL vulnerabilities are detected.
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  # ----------------------------------------------------------------------------
  # JOB 3: TAG & PUBLISH TO GITHUB CONTAINER REGISTRY (GHCR)
  # Runs only on verified merges/pushes to main (never on unmerged pull requests).
  # ----------------------------------------------------------------------------
  build-and-publish:
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable Git SHA and semantic version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=v1.0.0
            type=raw,value=latest

      - name: Build and push verified image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}